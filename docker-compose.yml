services:
  moshi:
    build: .
    restart: unless-stopped
    # SIGTERM starts an ordered shutdown: requests in flight get up to 10 s,
    # then the broker connection is drained and the database closed
    # (src/services/shutdown.ts). Docker's default of 10 s would cut that short.
    stop_grace_period: 30s
    environment:
      - NODE_ENV=production
      - NATS_URL=nats://nats:4222
      - MESH_ADMIN_TOKEN=${MESH_ADMIN_TOKEN}
      # Rotation: put the OLD token here, the new one above, deploy, move the
      # clients over, then empty this again. Empty means "none". It was never
      # passed on, so the rotation DEPLOY.md describes could not be switched on.
      - MESH_ADMIN_TOKEN_PREVIOUS=${MESH_ADMIN_TOKEN_PREVIOUS:-}
      - MESH_COOKIE_SECRET=${MESH_COOKIE_SECRET}
      - OAUTH_SECRET=${OAUTH_SECRET}
      # Empty = follow NODE_ENV (Secure on). Set to 0 only when the dashboard
      # is served over plain http, e.g. a LAN host without TLS.
      - MESH_COOKIE_SECURE=${MESH_COOKIE_SECURE:-}
      # This container is reachable through the proxy only (`expose`, no
      # `ports`), and the proxy appends its peer to X-Forwarded-For: that is
      # the address failed sign-ins are counted against. Set to 0 when you
      # publish the port yourself: then the header is the sender's own text.
      - MESH_BEHIND_PROXY=${MESH_BEHIND_PROXY:-1}
      # Content-Security-Policy: enforce | report | off. Empty = the default.
      # "report" sends the policy Report-Only: the browser says what it WOULD
      # block (POST /csp-report) and blocks nothing.
      - MESH_CSP=${MESH_CSP:-}
      - DATABASE_PATH=/data/moshi.db
      # Daily copies of the database. Empty means the defaults: next to the
      # database (/data/backups), seven of them. BACKUP_KEEP=0 switches them off.
      - BACKUP_DIR=${BACKUP_DIR:-}
      - BACKUP_KEEP=${BACKUP_KEEP:-}
      - PORT=80
    volumes:
      - moshi-data:/data
    expose:
      - "80"
    depends_on:
      nats:
        condition: service_healthy
    # Liveness, not readiness: /livez asks neither NATS nor SQLite. With
    # /health here, a broker outage marked this container unhealthy and took
    # the dashboard (which runs on SQLite) off the proxy along with it.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

  nats:
    # A version, not a floating tag. 2.12.6 is what production ran when this
    # was pinned (its log said so; the tag `2-alpine` had moved on to 2.15 by
    # then, and the host was still using the image it had pulled in spring).
    # scripts/test-integration.sh tests against the same version, and
    # tests/deploy-files.test.ts keeps the two together. Upgrading is a
    # decision: bump both, one minor at a time, with a copy of nats-data.
    image: nats:2.12.6-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  moshi-data:
  nats-data:
