services:
  moshi:
    build: .
    environment:
      - NODE_ENV=production
      - NATS_URL=nats://nats:4222
      - MESH_ADMIN_TOKEN=${MESH_ADMIN_TOKEN}
      - MESH_COOKIE_SECRET=${MESH_COOKIE_SECRET}
      - OAUTH_SECRET=${OAUTH_SECRET}
      # Empty = follow NODE_ENV (Secure on). Set to 0 only when the dashboard
      # is served over plain http, e.g. a LAN host without TLS.
      - MESH_COOKIE_SECURE=${MESH_COOKIE_SECURE:-}
      - DATABASE_PATH=/data/moshi.db
      - PORT=80
    volumes:
      - moshi-data:/data
    expose:
      - "80"
    depends_on:
      nats:
        condition: service_healthy
    # Liveness, not readiness: /livez asks neither NATS nor SQLite. With
    # /health here, a broker outage marked this container unhealthy and took
    # the dashboard (which runs on SQLite) off the proxy along with it.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  moshi-data:
  nats-data:
